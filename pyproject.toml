[project]
name = "devi-subhadra"
version = "0.1.0"
description = "Headless autonomous cognitive agent with a glass-box SQL audit trail."
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "tiktoken>=0.7",
    "uvicorn>=0.30",
    "playwright>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23"
]

[tool.uv]
package = false

[tool.pytest.ini_options]
python_files = ["*.test.py", "test_*.py"]
pythonpath = ["."]
testpaths = ["."]
# Keeps module.test.py from colliding with the sibling module of the same name.
addopts = ["--import-mode=importlib"]
